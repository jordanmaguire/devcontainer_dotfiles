<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review: {{title}}</title>
<style nonce="{{nonce}}">
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --border: #d1d9e0; --card: #f6f8fa;
    --del-bg: #ffebe9; --del-word: #ff818266; --add-bg: #dafbe1; --add-word: #4fc26b66;
    --accent: #0969da; --accent-fg: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --border: #3d444d; --card: #151b23;
      --del-bg: #3c1618; --del-word: #f8514966; --add-bg: #12261e; --add-word: #2ea04366;
      --accent: #4493f8; --accent-fg: #0d1117;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .count { color: var(--muted); margin: 0 0 20px; }
  .change { border: 1px solid var(--border); border-radius: 8px; margin: 0 0 16px; overflow: hidden; }
  .change.off .head label, .change.off .body > :not(.note) { opacity: 0.55; }
  .head { display: flex; gap: 6px; align-items: baseline; padding: 6px 12px 6px 4px; background: var(--card); }
  .head label { display: flex; flex: 1; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 4px 0; cursor: pointer; }
  .head input { transform: translateY(2px); width: 16px; height: 16px; margin: 0; cursor: pointer; flex: none; }
  button.fold { border: 0; background: none; padding: 4px 6px; color: var(--muted); font-size: 12px; line-height: 1; transition: transform 0.12s; }
  .change.closed button.fold { transform: rotate(-90deg); }
  .change.closed .body { display: none; }
  .num { font-weight: 600; }
  .name { font-weight: 600; }
  .reason { padding: 8px 12px 0; color: var(--muted); }
  .meta { padding: 6px 12px 0; display: flex; flex-direction: column; gap: 2px; }
  .loc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .head .commit { margin-left: auto; font-size: 13px; color: var(--muted); }
  .proposal { padding: 8px 12px 4px; white-space: pre-wrap; }
  .diff { margin: 8px 0 0; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; }
  .diff div { white-space: pre; padding: 0 12px; min-width: max-content; }
  .diff .del { background: var(--del-bg); }
  .diff .add { background: var(--add-bg); }
  .diff .ctx { color: var(--muted); }
  .diff .del mark { background: var(--del-word); color: inherit; border-radius: 2px; }
  .diff .add mark { background: var(--add-word); color: inherit; border-radius: 2px; }
  .note { padding: 10px 12px 12px; }
  .note textarea { display: block; width: 100%; min-height: 2.6em; resize: vertical; font: inherit; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .note textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); }
  .bar div { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  .status { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="count" id="count"></p>
  <div id="changes"></div>
</main>
<div class="bar"><div>
  <button class="primary" id="apply"></button>
  <button id="all">Tick all</button>
  <button id="none">Untick all</button>
  <span class="status" id="status" role="status"></span>
</div></div>
<script type="application/json" id="data">{{data}}</script>
<script nonce="{{nonce}}">
  const review = JSON.parse(document.getElementById('data').textContent)
  const boxes = new Map()
  const cards = new Map()
  const notes = new Map()
  let isSent = false

  const el = (tag, className, text) => {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined) node.textContent = text
    return node
  }

  const lines = text => (text === '' ? [] : text.replace(/\r/g, '').replace(/\n$/, '').split('\n'))

  // Word-level highlight: the tokens outside the longest common subsequence of the two lines are marked.
  const tokens = line => line.match(/\w+|\s+|[^\w\s]/g) ?? []
  const marked = (from, to) => {
    const a = tokens(from), b = tokens(to)
    if (a.length * b.length > 40000) return [[{ text: from, isMarked: true }], [{ text: to, isMarked: true }]]
    const table = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0))
    for (let i = a.length - 1; i >= 0; i--)
      for (let j = b.length - 1; j >= 0; j--)
        table[i][j] = a[i] === b[j] ? table[i + 1][j + 1] + 1 : Math.max(table[i + 1][j], table[i][j + 1])
    const left = [], right = []
    let i = 0, j = 0
    while (i < a.length || j < b.length) {
      if (i < a.length && j < b.length && a[i] === b[j]) {
        left.push({ text: a[i++], isMarked: false })
        right.push({ text: b[j++], isMarked: false })
      } else if (j >= b.length || (i < a.length && table[i + 1][j] >= table[i][j + 1])) left.push({ text: a[i++], isMarked: true })
      else right.push({ text: b[j++], isMarked: true })
    }
    // A line that keeps no word of the other reads better on its background alone than with every word marked.
    const isRewritten = parts => !parts.some(part => !part.isMarked && /\w/.test(part.text))
    if (isRewritten(left) || isRewritten(right)) return [[{ text: from }], [{ text: to }]]
    return [joined(left), joined(right)]
  }

  // Spaces between two marked words are marked too, so a changed phrase is one mark rather than one per word.
  const joined = parts =>
    parts.map((part, index) =>
      part.text.trim() === '' && parts[index - 1]?.isMarked && parts[index + 1]?.isMarked ? { ...part, isGap: true } : part,
    )

  const diffLine = (className, sign, parts) => {
    const row = el('div', className, sign)
    let mark
    for (const part of parts) {
      const isShown = (part.isMarked && part.text.trim() !== '') || part.isGap
      if (!isShown) mark = undefined
      else if (mark) mark.textContent += part.text
      else row.append((mark = el('mark', '', part.text)))
      if (!isShown) row.append(part.text)
    }
    return row
  }

  const diff = change => {
    const box = el('div', 'diff')
    const removed = lines(change.before), added = lines(change.after)
    const isPaired = removed.length === added.length
    const pairs = removed.map((line, index) => (isPaired ? marked(line, added[index]) : [[{ text: line }], []]))
    removed.forEach((line, index) => box.append(diffLine('del', '- ', pairs[index][0])))
    added.forEach((line, index) => box.append(diffLine('add', '+ ', isPaired ? pairs[index][1] : [{ text: line }])))
    lines(change.contextAfter).forEach(line => box.append(diffLine('ctx', '  ', [{ text: line }])))
    return box
  }

  const chosen = () => review.changes.filter(change => boxes.get(change.id).checked).map(change => change.id)
  const skipped = () => review.changes.filter(change => !boxes.get(change.id).checked).map(change => change.id)
  const list = ids => (ids.length === 0 ? 'none' : ids.join(', '))

  // How many commits the ticked changes go into; changes with the same commitKey share one.
  const commitCount = () => {
    const keys = new Set(
      review.changes.filter(change => boxes.get(change.id).checked && change.commitKey !== 'none').map(change => change.commitKey),
    )
    return keys.size === 1 ? '1 commit' : `${keys.size} commits`
  }

  const refresh = () => {
    const ticked = chosen().length
    const commits = review.hasCommits && ticked > 0 ? ` · ${commitCount()}` : ''
    document.getElementById('count').textContent = `${ticked} of ${review.changes.length} ticked${commits}`
    document.getElementById('apply').textContent = ticked === 0 ? 'Skip all' : `Apply selected (${ticked})`
    for (const change of review.changes)
      cards.get(change.id).classList.toggle('off', !boxes.get(change.id).checked)
  }

  const setOpen = (id, isOpen) => {
    cards.get(id).classList.toggle('closed', !isOpen)
    cards.get(id).querySelector('button.fold').setAttribute('aria-expanded', String(isOpen))
  }

  document.getElementById('title').textContent = review.title
  const container = document.getElementById('changes')
  for (const change of review.changes) {
    const card = el('section', 'change')
    cards.set(change.id, card)
    const head = el('div', 'head')
    const fold = el('button', 'fold', '▼')
    fold.type = 'button'
    fold.setAttribute('aria-label', `Show or hide change ${change.id}`)
    fold.addEventListener('click', () => setOpen(change.id, card.classList.contains('closed')))
    const label = el('label')
    const box = el('input')
    box.type = 'checkbox'
    box.checked = change.isSelected
    // Ticking a change opens its card and unticking closes it; the arrow opens or closes it alone.
    box.addEventListener('change', () => {
      setOpen(change.id, box.checked)
      refresh()
    })
    boxes.set(change.id, box)
    label.append(box, el('span', 'num', `${change.id}.`), el('span', 'name', change.title))
    if (review.hasCommits) label.append(el('span', 'commit', `→ ${change.commitLabel}`))
    head.append(fold, label)

    const body = el('div', 'body')
    if (change.reason !== '') body.append(el('div', 'reason', change.reason))
    const meta = el('div', 'meta')
    for (const place of change.places) meta.append(el('div', 'loc', place))
    body.append(meta)
    body.append(change.kind === 'proposal' ? el('div', 'proposal', change.proposal) : diff(change))
    const note = el('div', 'note')
    const field = el('textarea')
    field.rows = 2
    field.placeholder = 'Note for Claude (optional): a question, or what to do instead'
    field.setAttribute('aria-label', `Note on change ${change.id}`)
    notes.set(change.id, field)
    note.append(field)
    body.append(note)
    card.append(head, body)
    container.append(card)
    setOpen(change.id, change.isOpen)
  }

  const setAll = isChecked => {
    for (const [id, box] of boxes) {
      box.checked = isChecked
      setOpen(id, isChecked)
    }
    refresh()
  }
  document.getElementById('all').addEventListener('click', () => setAll(true))
  document.getElementById('none').addEventListener('click', () => setAll(false))

  const status = document.getElementById('status')
  const buttons = document.querySelectorAll('.bar button')
  document.getElementById('apply').addEventListener('click', async () => {
    if (isSent) return
    buttons.forEach(button => (button.disabled = true))
    const selected = chosen()
    const written = Object.fromEntries(
      [...notes].filter(([, field]) => field.value.trim() !== '').map(([id, field]) => [id, field.value]),
    )
    try {
      const response = await fetch('submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ selected, notes: written }),
      })
      if (!response.ok) throw new Error(String(response.status))
      isSent = true
      boxes.forEach(box => (box.disabled = true))
      notes.forEach(field => (field.readOnly = true))
      status.textContent = `Sent to Claude: apply ${list(selected)}; skip ${list(skipped())}. You can close this tab.`
    } catch {
      buttons.forEach(button => (button.disabled = false))
      status.textContent =
        'Could not reach Claude Code. The review may have been answered in the pane or replaced by a newer one.'
    }
  })

  refresh()
</script>
</body>
</html>
